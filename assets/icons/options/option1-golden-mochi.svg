<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="128" height="128" shape-rendering="crispEdges">
  <!-- Option 1: Golden Mochi Poyori (Classic Mascot) -->
  <!-- Outline -->
  <rect x="5" y="1" width="6" height="1" fill="#2d3436"/>
  <rect x="3" y="2" width="2" height="1" fill="#2d3436"/>
  <rect x="11" y="2" width="2" height="1" fill="#2d3436"/>
  <rect x="2" y="3" width="1" height="2" fill="#2d3436"/>
  <rect x="13" y="3" width="1" height="2" fill="#2d3436"/>
  <rect x="1" y="5" width="1" height="6" fill="#2d3436"/>
  <rect x="14" y="5" width="1" height="6" fill="#2d3436"/>
  <rect x="2" y="11" width="1" height="2" fill="#2d3436"/>
  <rect x="13" y="11" width="1" height="2" fill="#2d3436"/>
  <rect x="3" y="13" width="2" height="1" fill="#2d3436"/>
  <rect x="11" y="13" width="2" height="1" fill="#2d3436"/>
  <rect x="5" y="14" width="6" height="1" fill="#2d3436"/>

  <!-- Body Fill: Golden Mochi Yellow -->
  <rect x="5" y="2" width="6" height="1" fill="#ffeaa7"/>
  <rect x="3" y="3" width="10" height="2" fill="#ffeaa7"/>
  <rect x="2" y="5" width="12" height="6" fill="#fdcb6e"/>
  <rect x="3" y="11" width="10" height="2" fill="#e17055"/>
  <rect x="5" y="13" width="6" height="1" fill="#e17055"/>

  <!-- Highlights -->
  <rect x="4" y="3" width="2" height="1" fill="#ffffff"/>
  <rect x="3" y="4" width="1" height="2" fill="#ffffff"/>

  <!-- Eyes -->
  <rect x="5" y="6" width="1" height="2" fill="#2d3436"/>
  <rect x="10" y="6" width="1" height="2" fill="#2d3436"/>

  <!-- Cheeks: Cute Blush -->
  <rect x="3" y="8" width="2" height="1" fill="#ff7675"/>
  <rect x="11" y="8" width="2" height="1" fill="#ff7675"/>

  <!-- Mouth -->
  <rect x="7" y="8" width="2" height="1" fill="#2d3436"/>

  <!-- Little Sprout / Antenna on top -->
  <rect x="7" y="0" width="2" height="1" fill="#00b894"/>
  <rect x="8" y="1" width="1" height="1" fill="#00b894"/>
</svg>
