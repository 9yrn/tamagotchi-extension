<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="128" height="128" shape-rendering="crispEdges">
  <!-- Option 3: Denki Cyber Pikoneko (Cyber Tech Branch) -->
  <!-- Cat Ears -->
  <rect x="2" y="1" width="3" height="3" fill="#00cec9"/>
  <rect x="3" y="2" width="1" height="2" fill="#ffeaa7"/>
  <rect x="11" y="1" width="3" height="3" fill="#00cec9"/>
  <rect x="12" y="2" width="1" height="2" fill="#ffeaa7"/>

  <!-- Head Outline -->
  <rect x="5" y="3" width="6" height="1" fill="#2d3436"/>
  <rect x="1" y="4" width="1" height="7" fill="#2d3436"/>
  <rect x="14" y="4" width="1" height="7" fill="#2d3436"/>
  <rect x="2" y="11" width="12" height="1" fill="#2d3436"/>

  <!-- Head Face Fill (Cyber Dark Metallic) -->
  <rect x="2" y="4" width="12" height="7" fill="#2d3436"/>

  <!-- Glowing Cyan Visor / Pixel Eyes -->
  <rect x="4" y="5" width="2" height="2" fill="#00cec9"/>
  <rect x="4" y="5" width="1" height="1" fill="#ffffff"/>
  <rect x="10" y="5" width="2" height="2" fill="#00cec9"/>
  <rect x="10" y="5" width="1" height="1" fill="#ffffff"/>

  <!-- Golden Lightning Bolt Brow Emblem -->
  <rect x="7" y="3" width="2" height="1" fill="#fdcb6e"/>
  <rect x="6" y="4" width="2" height="1" fill="#fdcb6e"/>
  <rect x="7" y="5" width="1" height="1" fill="#fdcb6e"/>

  <!-- Pixel Nose & Whiskers -->
  <rect x="7" y="7" width="2" height="1" fill="#ffeaa7"/>
  <rect x="2" y="7" width="1" height="1" fill="#00cec9"/>
  <rect x="13" y="7" width="1" height="1" fill="#00cec9"/>
  <rect x="1" y="8" width="1" height="1" fill="#00cec9"/>
  <rect x="14" y="8" width="1" height="1" fill="#00cec9"/>

  <!-- Digital Collar with LED Core -->
  <rect x="4" y="12" width="8" height="2" fill="#6c5ce7"/>
  <rect x="7" y="12" width="2" height="2" fill="#fdcb6e"/>

  <!-- Lightning Tail Tip -->
  <rect x="14" y="12" width="2" height="1" fill="#fdcb6e"/>
  <rect x="13" y="13" width="2" height="1" fill="#fdcb6e"/>
  <rect x="14" y="14" width="1" height="2" fill="#fdcb6e"/>
</svg>
