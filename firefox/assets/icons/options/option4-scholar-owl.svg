<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="128" height="128" shape-rendering="crispEdges">
  <!-- Option 4: Chishiki Scholar Owl (Knowledge & Study Branch) -->
  <!-- Feather Tufts / Horns -->
  <rect x="2" y="1" width="2" height="3" fill="#6c5ce7"/>
  <rect x="12" y="1" width="2" height="3" fill="#6c5ce7"/>

  <!-- Head Silhouette Outline -->
  <rect x="4" y="2" width="8" height="1" fill="#2d3436"/>
  <rect x="1" y="4" width="1" height="8" fill="#2d3436"/>
  <rect x="14" y="4" width="1" height="8" fill="#2d3436"/>
  <rect x="3" y="14" width="10" height="1" fill="#2d3436"/>

  <!-- Body Fill: Scholarly Indigo -->
  <rect x="2" y="4" width="12" height="8" fill="#4834d4"/>
  <rect x="3" y="12" width="10" height="2" fill="#30336b"/>

  <!-- Constellation Forehead Star -->
  <rect x="7" y="3" width="2" height="2" fill="#ffeaa7"/>
  <rect x="6" y="4" width="4" height="1" fill="#fdcb6e"/>

  <!-- Scholarly Round Glasses (Gold Wireframe) -->
  <rect x="3" y="5" width="4" height="4" fill="#fdcb6e"/>
  <rect x="9" y="5" width="4" height="4" fill="#fdcb6e"/>
  <rect x="7" y="6" width="2" height="1" fill="#fdcb6e"/>

  <!-- Big Curious Owl Eyes (Glass Interior) -->
  <rect x="4" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="10" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="5" y="6" width="1" height="2" fill="#2d3436"/>
  <rect x="11" y="6" width="1" height="2" fill="#2d3436"/>

  <!-- Beak -->
  <rect x="7" y="8" width="2" height="2" fill="#e17055"/>
  <rect x="7" y="10" width="2" height="1" fill="#d63031"/>

  <!-- Open Little Spellbook / Tome at Bottom -->
  <rect x="4" y="12" width="4" height="2" fill="#dfe6e9"/>
  <rect x="8" y="12" width="4" height="2" fill="#dfe6e9"/>
  <rect x="7" y="12" width="2" height="2" fill="#b2bec3"/>
  <rect x="4" y="14" width="8" height="1" fill="#fdcb6e"/>
</svg>
